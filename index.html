<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <meta name="description" content="Aplikasi latihan bahasa Inggris pemula dengan materi sumber, kalimat praktis, dan review bersela.">
  <title>Small Steps English</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=20261024-reading">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navigasi utama">
      <a class="brand" href="#home" aria-label="Small Steps English, beranda">
        <span class="brand-mark">s.</span>
        <span><strong>small steps</strong><small>english practice</small></span>
      </a>
      <div class="side-label">BELAJAR</div>
      <nav class="side-nav">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span> Beranda</button>
        <button class="nav-item" data-view="library"><span class="nav-icon">▤</span> Materi belajar <span id="lesson-nav-count" class="nav-count">—</span></button>
        <button class="nav-item" data-view="reading"><span class="nav-icon">▦</span> Rencana baca <span id="reading-nav-count" class="nav-count">0/28</span></button>
        <button class="nav-item" data-view="review"><span class="nav-icon">↻</span> Ulangi kalimat <span id="review-nav-count" class="nav-count warm">0</span></button>
      </nav>
      <div class="sidebar-note">
        <span class="note-spark">✳</span>
        <strong>Pelan-pelan saja.</strong>
        <p>Latihan singkat yang rutin lebih mudah diingat.</p>
      </div>
      <div class="sidebar-bottom"><span class="status-dot"></span> Progres tersimpan di perangkat ini</div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb">Ruang belajar <span>/</span> Beranda</div>
        <button class="profile-chip" title="Progres disimpan di perangkat ini"><span class="profile-avatar">K</span><span>Pelajar</span></button>
      </header>
      <div id="app-content" class="content"></div>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Navigasi bawah">
    <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><small>Beranda</small></button>
    <button class="nav-item" data-view="library"><span class="nav-icon">▤</span><small>Materi</small></button>
    <button class="nav-item" data-view="reading"><span class="nav-icon">▦</span><small>Rencana</small></button>
    <button class="nav-item" data-view="review"><span class="nav-icon">↻</span><small>Review</small><i id="mobile-review-dot"></i></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js?v=20261024-reading" defer></script>
</body>
</html>
